name: Project Map checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/map-view.test.cjs tests/map-navigation.test.cjs tests/knowledge-request.test.cjs
